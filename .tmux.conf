# Change the main prefix to C-a
unbind-key C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# Vi mode
set-window-option -g mode-keys vi

# Allow Kitty-compatible sequences (e.g. shift+enter)
set -g extended-keys on

# prevent delay in nvim when leaving insert mode
set -s escape-time 0

# pass terminal focus events through to programs (e.g. nvim's FocusLost/
# FocusGained) so tint.nvim can dim all splits when this pane loses focus
set -g focus-events on

# make tmux display things in true color
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",xterm-256color*:Tc"

# set scrollback history to 10000 (10k)
set -g history-limit 10000

# set window and pane index to 1 (0 by default)
set-option -g base-index 1
setw -g pane-base-index 1

# reload ~/.tmux.conf using PREFIX r
bind r source-file ~/.tmux.conf \; display "Tmux config reloaded"

# open new windows in current directory
bind c new-window -c "#{pane_current_path}"

# change shortcuts for vertical/horizontal splits
bind - split-window -v -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind '"' split-window -h -c "#{pane_current_path}"

# Smart pane switching with awareness of Vim splits.
# See: https://github.com/christoomey/vim-tmux-navigator
vim_pattern='(\S+/)?g?\.?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?'
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +${vim_pattern}$'"

bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'

tmux_version='$(tmux -V | sed -En "s/^tmux ([0-9]+(.[0-9]+)?).*/\1/p")'
if-shell -b '[ "$(echo "$tmux_version < 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\'  'select-pane -l'"
if-shell -b '[ "$(echo "$tmux_version >= 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\\\'  'select-pane -l'"

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l

# resize panes using PREFIX H, J, K, L
bind H resize-pane -L 5
bind J resize-pane -D 5
bind K resize-pane -U 5
bind L resize-pane -R 5

# restore "clear" as <prefix> C-l
bind C-l send-keys 'C-l'

# mouse control
setw -g mouse on

# make copy-paste less of a nightmare by allowing vi commands for yanking
# and pasting (to the system clipboard)
set-option -s set-clipboard off
bind P paste-buffer
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"

# auto-set window title
setw -g automatic-rename on

# Theme config (before loading the plugin)
set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_status_style "rounded"
# Show the window NAME (#W) in the list, not the pane title (#T, defaults to hostname)
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W"
set -g @catppuccin_pane_border_style "fg=#{@thm_surface_1}"
set -g @catppuccin_pane_active_border_style "fg=#{@thm_sapphire},bold"

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'catppuccin/tmux#v2.3.0'
set -g @plugin 'tmux-plugins/tmux-cpu'      # provides #{cpu_percentage} + #{ram_percentage}
set -g @plugin 'tmux-plugins/tmux-battery'  # provides #{battery_percentage} + #{battery_icon}

# Make pane titles and status bar pretty (after loading plugins)
set -g pane-border-status top
# pane_title defaults to the hostname; only programs that opt in (e.g. nvim with
# 'title') change it. So: show a real title when one is set, else the command.
set -g pane-border-format " #{pane_index}: #{?#{==:#{pane_title},#{host}},#{pane_current_command},#{pane_title}} "
set -g status-left-length 100
set -g status-right-length 100
set -g status-left ""
# Each module is a styled pill (icon + text). cpu/ram/battery read their
# numbers from the tmux-cpu / tmux-battery plugins; -F expands those at set time.
set -gF  status-right "#{E:@catppuccin_status_cpu}"
set -agF status-right "#{E:@catppuccin_status_ram}"
set -ag  status-right "#{E:@catppuccin_status_date_time}"
set -agF status-right "#{E:@catppuccin_status_battery}"
#
# Dim inactive panes so the active one pops (set AFTER the plugin: these are
# native style options that need @thm_* expanded now, hence -F).
# Tune contrast via the inactive fg: overlay_0 (dimmest) -> overlay_1 -> subtext_0 (subtle).
set -gF window-style "fg=#{@thm_overlay_1},bg=#{@thm_mantle}"
set -gF window-active-style "fg=#{@thm_fg},bg=#{@thm_bg}"

run '~/.tmux/plugins/tpm/tpm'

