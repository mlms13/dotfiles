###############################################################################
# Prefix
###############################################################################

# Change the main prefix to C-a
unbind-key C-b
set-option -g prefix C-a
bind-key C-a send-prefix

###############################################################################
# General Settings
###############################################################################

# Vi mode
set -wg mode-keys vi

# Allow Kitty-compatible sequences (e.g. shift+enter)
set -g extended-keys on

# prevent delay in nvim when leaving insert mode
set -s escape-time 0

# make tmux display things in true color
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",xterm-256color*:Tc"

# set scrollback history to 10000 (10k)
set -g history-limit 10000

# window and pane numbering
set -g base-index 1 # panes start at 1
set -wg pane-base-index 1 # windows start at 1
set -g renumber-windows on # windows auto-set numbers after deleting

# mouse control
set -wg mouse on

# pass terminal focus events through to programs (e.g. nvim's FocusLost/
# FocusGained) so tint.nvim can dim all splits when this pane loses focus
set -g focus-events on

# Show pane titles
set -g pane-border-status top

# Show the program-set title when there is one; otherwise (empty title, or the
# default title which is just the hostname -- e.g. a plain shell) the command.
set -g pane-border-format " #{pane_index}: #{?#{||:#{==:#{pane_title},#{host}},#{==:#{pane_title},}},#{pane_current_command},#{pane_title}} "

# auto-set window title
set -wg automatic-rename on

###############################################################################
# Key Bindings
###############################################################################

# reload ~/.tmux.conf using PREFIX r
bind r source-file ~/.tmux.conf \; display "Tmux config reloaded"

# open new windows in current directory
bind c new-window -c "#{pane_current_path}"

# change shortcuts for vertical/horizontal splits
bind - split-window -v -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"

# resize panes using PREFIX H, J, K, L
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# swap (move) windows left and right
bind -r "<" swap-window -d -t -1
bind -r ">" swap-window -d -t +1

###############################################################################
# Pane Switching via Vim Movement
###############################################################################

# Smart pane switching with awareness of Vim splits.
# See: https://github.com/christoomey/vim-tmux-navigator
vim_pattern='(\S+/)?g?\.?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?'
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +${vim_pattern}$'"

bind -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'

tmux_version='$(tmux -V | sed -En "s/^tmux ([0-9]+(.[0-9]+)?).*/\1/p")'
if-shell -b '[ "$(echo "$tmux_version < 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\'  'select-pane -l'"
if-shell -b '[ "$(echo "$tmux_version >= 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\\\'  'select-pane -l'"

bind -T copy-mode-vi 'C-h' select-pane -L
bind -T copy-mode-vi 'C-j' select-pane -D
bind -T copy-mode-vi 'C-k' select-pane -U
bind -T copy-mode-vi 'C-l' select-pane -R
bind -T copy-mode-vi 'C-\' select-pane -l

# restore "clear" as <prefix> C-l
bind C-l send-keys 'C-l'

###############################################################################
# Copy-Paste
###############################################################################

# make copy-paste less of a nightmare by allowing vi commands for yanking
# and pasting (to the system clipboard)
set -s set-clipboard off

bind P paste-buffer
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"

###############################################################################
# Styling
###############################################################################

# Theme config (before loading the plugin)

# Default flavor, but ONLY if one isn't already chosen (-o). The theme hooks
# below set the flavor and then re-source this file
set -ogq @catppuccin_flavor 'mocha'

# We do a FULL reload (source-file) because all of our post-plugin custom
# styling -- window-style, all of the status-right stuff -- only runs on a full
# config source.
# 
# NOTE: wrapped in `run-shell` so the work happens as a FRESH, top-level tmux
# invocation rather than inline in the hook's command queue.
# @theme_reload allows it to skip the expensive full `run tpm` and only re-run
# the cpu/ram/battery interpolation
set-hook -g client-dark-theme  "run-shell 'tmux set -g @catppuccin_flavor mocha; tmux set -g @theme_reload 1; tmux source-file ~/.tmux.conf'"
set-hook -g client-light-theme "run-shell 'tmux set -g @catppuccin_flavor latte; tmux set -g @theme_reload 1; tmux source-file ~/.tmux.conf'"

set -g @catppuccin_pane_border_style "fg=#{@thm_surface_1}"
set -g @catppuccin_pane_active_border_style "fg=#{@thm_sapphire},bold"

# Status bar colors, set with the deferred approach before loading the plugin
set -g @catppuccin_cpu_color "#{E:@thm_peach}"   # CPU -> orange
set -g @catppuccin_ram_color "#{E:@thm_yellow}"  # memory -> yellow

# Level at which battery will show a red warning (similar to the memory plugin)
set -g @batt_low_threshold "10"

set -g @catppuccin_date_time_icon "󰥔 "          # time pill: clock icon, HH:MM
set -g @catppuccin_date_time_color "#{E:@thm_blue}"
set -g @catppuccin_date_time_text " %H:%M"

set -g @tmux-weather-units "u"        # u = imperial; m = metric
set -g @tmux-weather-format "1"
set -g @tmux-weather-location "80301" # city / ZIP / "lat,lon"; unset = auto by IP
set -g @catppuccin_weather_color "#{E:@thm_green}"
# Catppuccin's default wraps #{weather} in #{l:...} for tmux-weather's load-time
# placeholder swap, which can't see our pill -- so call the script directly.
set -g @catppuccin_weather_text " #(~/.tmux/plugins/tmux-weather/scripts/weather.sh)"

# Clear icon styling on reload (to bust Catppuccin's cache)
set -ug @catppuccin_status_cpu_icon_bg
set -ug @catppuccin_status_ram_icon_bg
set -ug @catppuccin_status_date_time_icon_bg
set -ug @catppuccin_status_weather_icon_bg

# De-freeze each pill's TEXT foreground before the theme (re)loads. Unsetting
# forces each to re-derive from the current flavor on every load.
set -ug @catppuccin_status_cpu_text_fg
set -ug @catppuccin_status_ram_text_fg
set -ug @catppuccin_status_date_time_text_fg
set -ug @catppuccin_status_weather_text_fg
set -ug @catppuccin_status_battery_text_fg

###############################################################################
# Plugins via TPM
###############################################################################

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'catppuccin/tmux#v2.3.0'
set -g @plugin 'tmux-plugins/tmux-cpu'      # provides cpu and ram
set -g @plugin 'tmux-plugins/tmux-battery'  # provides battery pct and icon
set -g @plugin 'xamut/tmux-weather'         # provides #{weather}
set -g @plugin 'tmux-plugins/tmux-resurrect' # save/restore sessions across restarts
set -g @plugin 'tmux-plugins/tmux-continuum' # auto-save + auto-restore on tmux start

###############################################################################
# Session Save/Restore (resurrect + continuum)
###############################################################################

# Restore visible pane contents (scrollback text) too
set -g @resurrect-capture-pane-contents 'on'

# Programs to relaunch on restore beyond the defaults (vim/nvim/less/etc.).
# - claude panes resume the most recent conversation for that pane's cwd
# - just / pnpm dev servers restart with their original arguments (~ matches
#   anywhere in the command line, since pnpm's actual argv starts with node)
set -g @resurrect-processes '"~claude->claude --continue" just "~pnpm -s dev"'

# Auto-save every 10 minutes; auto-restore when the tmux server starts fresh
set -g @continuum-save-interval '10'
set -g @continuum-restore 'on'

###############################################################################
# Catppuccin (After Plugins Load)
###############################################################################

set -g status-left-length 100
set -g status-right-length 100
set -g status-left ""

# Re-derive @thm_* for the current flavor NOW, before the -F bakes below, else a
# reload captures the previous flavor and lags one switch (@catppuccin_reset clears
# the only-if-unset values). source-file (not `run`) keeps it synchronous, so the
# palette is ready before the bakes even when sourced from a theme hook.
set -g @catppuccin_reset "true"
source-file ~/.tmux/plugins/tmux/catppuccin_options_tmux.conf

# Window-list styling. Set after the reset above (which unset these) but BEFORE
# sourcing catppuccin_tmux.conf below, where they're baked into the formats and the
# rounded separators -- setting them after that source froze the active caps blank.
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_text " #W"          # window list shows the window NAME...
set -g @catppuccin_window_current_text " #W"   # ...not the active pane's title (#T)

# Clear the six separator caches so catppuccin_tmux.conf re-derives them for the
# "rounded" style on every reload -- catppuccin sets them only-if-unset, so a value
# baked under an earlier style or light/dark switch would otherwise stick.
set -ug @catppuccin_window_left_separator
set -ug @catppuccin_window_middle_separator
set -ug @catppuccin_window_right_separator
set -ug @catppuccin_window_current_left_separator
set -ug @catppuccin_window_current_middle_separator
set -ug @catppuccin_window_current_right_separator

# Modify Catppuccin's battery module to change text fg/bg when the battery drops
# below a configured percentage threshold
set -g @catppuccin_status_battery_text_bg "#{l:#(~/.tmux/custom/battery_color.sh bg)}"
set -g @catppuccin_status_battery_text_fg "#{l:#(~/.tmux/custom/battery_color.sh fg)}"

# Trailing space adds fake padding that respects the bg color change
set -g @catppuccin_battery_text " #{l:#{battery_percentage}} "

source-file ~/.tmux/plugins/tmux/catppuccin_tmux.conf

# Each module is a styled pill (icon + text). cpu / ram / battery MUST use -F:
# the tmux-cpu / tmux-battery plugins find a literal #{cpu_percentage} etc. in
# this option at load time and swap in their scripts, so -F has to bake that
# placeholder in here first. weather / dateday / date_time need no such swap
# (weather calls its script directly; the others are strftime), so they stay
# lazy (-ag) -- which also lets dateday be referenced before it's built below.
set -gF  status-right "#{E:@catppuccin_status_cpu}"
set -agF status-right "#{E:@catppuccin_status_ram}"
set -ag  status-right "#{E:@catppuccin_status_weather}"
set -ag  status-right "#{E:@catppuccin_status_dateday}"
set -ag  status-right "#{E:@catppuccin_status_date_time}"
set -agF status-right "#{E:@catppuccin_status_battery}"

# Dim inactive panes so the active one pops (set AFTER the plugin: these are
# native style options that need @thm_* expanded now, hence -F).
# Tune contrast via: overlay_0 (dimmest) -> overlay_1 -> subtext_0 (subtle).
set -gF window-style "fg=#{@thm_overlay_1},bg=#{@thm_mantle}"
set -gF window-active-style "fg=#{@thm_fg},bg=#{@thm_bg}"

# Normal load (fresh start / prefix-r): run all of TPM, which installs/sources
# plugins and does the cpu/ram/battery interpolation. On a theme TOGGLE, the 
# plugins are already installed, so the @theme_reload hook skips it and only
# re-runs the cpu/battery interpolation.
if-shell -F '#{@theme_reload}' \
  'run-shell "~/.tmux/plugins/tmux-cpu/cpu.tmux" ; run-shell "~/.tmux/plugins/tmux-battery/battery.tmux"' \
  "run '~/.tmux/plugins/tpm/tpm'"

# continuum's auto-save trigger lives as an interpolation in status-right,
# which the re-source above just rebuilt from scratch -- without re-adding it,
# a theme toggle would silently stop the auto-saves.
#
# Re-add ONLY the save interpolation by hand; don't re-run all of continuum,
# which would re-run its auto-restore 
if-shell -F '#{@theme_reload}' \
  'set -ag status-right "#(~/.tmux/plugins/tmux-continuum/scripts/continuum_save.sh)"'

set -ug @theme_reload

###############################################################################
# Custom "date" status module (after TPM)
###############################################################################

# Our custom date module must be built here, after loading plugins, because it
# needs the @thm_* colors to be defined
source -F "~/.tmux/custom/dateday.conf"

