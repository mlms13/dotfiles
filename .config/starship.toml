# Added for editor completions
"$schema" = 'https://starship.rs/config-schema.json'

# Add newline before new prompts
add_newline = true

# Explicitly list the modules to render. This is the default `$all` order with
# every language/runtime module removed -- the icons only told us "this is a
# node project", which we already know from the directory we're standing in.
# Anything absent from this string is never rendered, so there's no need to
# `disabled = true` each of the ~60 language modules individually.
format = """
$username$hostname$localip$shlvl$singularity\
$kubernetes$nats\
$directory\
$vcsh$fossil_branch$fossil_metrics\
$git_branch$git_commit$git_state$git_metrics$git_status\
$hg_branch$hg_state$pijul_channel\
$terraform\
$guix_shell$nix_shell$conda\
$memory_usage\
$aws$gcloud$openstack$azure\
$direnv$env_var$mise\
$custom$sudo\
$cmd_duration\
$line_break$jobs$battery$time$status$container$netns$os$shell\
$character"""

# But keep the input on the same line as the prompt
[line_break]
disabled = true

[aws]
disabled = true
