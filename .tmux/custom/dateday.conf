# vim:set ft=tmux:
# Custom catppuccin status module: the date, e.g. "Thu Jun 4".
#
# Modeled on the plugin's own modules (~/.tmux/plugins/tmux/status/*.conf): it
# sets the module's inputs and then sources the shared helper, which assembles a
# pill that matches the built-in cpu/ram/date_time look. It must live in its own
# file (with its own `%hidden MODULE_NAME`) -- inlining this in .tmux.conf after
# another module's `source` leaves MODULE_NAME stuck on the previous module.
%hidden MODULE_NAME="dateday"

# Tweak these to restyle the date. Strftime: %a=Thu %b=Jun %-d=4 (no zero pad).
set -gq @catppuccin_dateday_icon "󰃭 "
set -gF @catppuccin_dateday_color "#{E:@thm_sapphire}"
set -gq @catppuccin_dateday_text " %a %b %-d"

# Clear the derived icon bg so a reload recomputes it from the color above
# (the helper only sets it when empty).
set -ug @catppuccin_status_dateday_icon_bg

# Clear the derived TEXT foreground too. status_module.conf sets it with `set -o`
# (only-if-unset) baked to the active flavor's @thm_fg, so without this it stays
# frozen at the first flavor's color -> unreadable light-on-light after a switch.
set -ug @catppuccin_status_dateday_text_fg

source -F "/Users/michael/.tmux/plugins/tmux/utils/status_module.conf"
